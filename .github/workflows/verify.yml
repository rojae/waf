name: Verify WAF contracts

on:
  pull_request:
  push:
    branches: [main, rojae/waf-reform-review]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - run: ./gradlew --no-daemon test :waf-dashboard-api:bootJar :waf-social-api:bootJar

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --no-cache
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  processors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        processor: [realtime-processor, alert-processor]
    defaults:
      run:
        working-directory: services/${{ matrix.processor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/${{ matrix.processor }}/go.mod
          cache-dependency-path: services/${{ matrix.processor }}/go.sum
      - run: go test ./...
      - run: go vet ./...

  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s kafka-clickhouse-consumer/tests
      - name: Verify generated Kubernetes configuration matches source
        run: |
          bash scripts/generate-k8s-configmaps.sh
          git diff --exit-code -- k8s/02-configmaps-only.yaml
      - run: python3 scripts/tests/test-runtime-config.py
      - run: docker compose --env-file .env.example config --quiet
      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n 1 bash -n
