---
# Custom ModSecurity Rules ConfigMap
# This ConfigMap will be automatically managed by the WAF Dashboard API
# Manual changes may be overwritten during deployments
apiVersion: v1
kind: ConfigMap
metadata:
  name: modsecurity-custom-rules
  namespace: waf-system
  labels:
    app: waf
    component: custom-rules
    managed-by: waf-dashboard
  annotations:
    waf.rojae.kr/description: "Custom ModSecurity rules managed by WAF Dashboard"
    waf.rojae.kr/auto-managed: "true"
    waf.rojae.kr/created-at: "2025-01-24T00:00:00Z"
data:
  # Custom rules configuration file
  # This content is generated by the WAF Dashboard API
  custom-rules.conf: |
    # WAF Custom Rules - Managed by Dashboard
    # DO NOT EDIT MANUALLY - Changes will be overwritten
    # Last updated: Auto-generated

    # Placeholder - Rules will be populated by the dashboard
    # Example rule format:
    # SecRule ARGS "@detectSQLi" \
    #   "id:9001,\
    #   phase:2,\
    #   block,\
    #   msg:'Custom SQL Injection Rule',\
    #   logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    #   t:none,t:urlDecodeUni,t:htmlEntityDecode"

---
# Update Nginx WAF deployment to mount custom rules
# This patches the existing nginx-waf deployment to include custom rules
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-waf-with-custom-rules
  namespace: waf-system
  labels:
    app: nginx-waf
    component: waf
    version: custom-rules-enabled
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-waf
  template:
    metadata:
      labels:
        app: nginx-waf
        component: waf
        version: custom-rules-enabled
      annotations:
        waf.rojae.kr/custom-rules-enabled: "true"
        waf.rojae.kr/rules-updated: "placeholder"
    spec:
      initContainers:
      - name: wait-for-custom-rules
        image: busybox:1.35
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for custom rules ConfigMap..."
          while [ ! -f /etc/modsecurity/custom-rules.conf ]; do
            echo "Custom rules not found, waiting..."
            sleep 2
          done
          echo "Custom rules ConfigMap mounted successfully"
          echo "Rules content preview:"
          head -10 /etc/modsecurity/custom-rules.conf
        volumeMounts:
        - name: custom-rules
          mountPath: /etc/modsecurity
          readOnly: true
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        env:
        - name: MODSEC_CUSTOM_RULES_ENABLED
          value: "true"
        - name: MODSEC_RULE_ENGINE
          value: "On"
        - name: MODSEC_AUDIT_LOG_ENABLED
          value: "true"
        volumeMounts:
        # Existing ModSecurity configuration
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: modsec-config
          mountPath: /etc/modsecurity
          readOnly: true
        # Custom rules volume
        - name: custom-rules
          mountPath: /etc/modsecurity/custom
          readOnly: true
        # ModSecurity logs (for audit trail)
        - name: modsec-logs
          mountPath: /var/log/modsecurity
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      # Existing volumes
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: modsec-config
        configMap:
          name: modsecurity-config
      # Custom rules volume
      - name: custom-rules
        configMap:
          name: modsecurity-custom-rules
          defaultMode: 0644
      # Logs volume
      - name: modsec-logs
        emptyDir: {}

      # Rolling update strategy
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1

---
# Service for the updated deployment
apiVersion: v1
kind: Service
metadata:
  name: nginx-waf-custom-rules-service
  namespace: waf-system
  labels:
    app: nginx-waf
    component: waf-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: nginx-waf

---
# NodePort service for external access
apiVersion: v1
kind: Service
metadata:
  name: nginx-waf-custom-rules-nodeport
  namespace: waf-system
  labels:
    app: nginx-waf
    component: waf-nodeport
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    nodePort: 30443
    protocol: TCP
    name: https
  selector:
    app: nginx-waf