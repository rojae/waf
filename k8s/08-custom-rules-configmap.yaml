---
# Draft ModSecurity custom rules ConfigMap.
# PR1 stores draft rules only; active nginx rollout requires a later
# validation/reload adapter.
apiVersion: v1
kind: ConfigMap
metadata:
  name: modsecurity-custom-rules
  namespace: waf-system
  labels:
    app: waf
    component: custom-rules
    managed-by: waf-dashboard
  annotations:
    waf.rojae.kr/description: "Draft custom ModSecurity rules managed by WAF Dashboard"
    waf.rojae.kr/auto-managed: "true"
    waf.rojae.kr/applied: "false"
data:
  custom-rules.conf: |
    # WAF Custom Rules - Drafts Only
    # Not applied to nginx in PR1.
    # Runtime validation and reload are required before active deployment.
