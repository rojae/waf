---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: waf-monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.35
        command: ['sh', '-c', 'chown -R 472:472 /var/lib/grafana && chmod -R 755 /var/lib/grafana']
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        securityContext:
          runAsUser: 0
      - name: wait-for-influxdb
        image: curlimages/curl:8.4.0
        command:
        - /bin/sh
        - -c
        - |
          until curl -f http://influxdb.waf-data.svc.cluster.local:8086/ping >/dev/null 2>&1; do
            echo "Waiting for InfluxDB..."
            sleep 10
          done
          echo "InfluxDB is ready!"
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:10.4.3
        securityContext:
          runAsUser: 472
          runAsGroup: 472
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: waf-grafana-pvc

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: waf-monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: grafana

---
# Grafana NodePort for external access
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: waf-monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
    protocol: TCP
  selector:
    app: grafana

---
# Kibana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: waf-monitoring
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      initContainers:
      - name: wait-for-elasticsearch
        image: curlimages/curl:8.4.0
        command:
        - /bin/sh
        - -c
        - |
          until curl -f http://elasticsearch.waf-data.svc.cluster.local:9200/_cluster/health >/dev/null 2>&1; do
            echo "Waiting for Elasticsearch..."
            sleep 10
          done
          echo "Elasticsearch is ready!"
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.15.2
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch.waf-data.svc.cluster.local:9200"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 30
          periodSeconds: 10

---
# Kibana Service
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: waf-monitoring
  labels:
    app: kibana
spec:
  type: ClusterIP
  ports:
  - port: 5601
    targetPort: 5601
    protocol: TCP
  selector:
    app: kibana

---
# Kibana NodePort for external access
apiVersion: v1
kind: Service
metadata:
  name: kibana-nodeport
  namespace: waf-monitoring
  labels:
    app: kibana
spec:
  type: NodePort
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30601
    protocol: TCP
  selector:
    app: kibana

---
# Logstash Deployment (waf-system)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-logstash
  namespace: waf-system
  labels:
    app: waf-logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-logstash
  template:
    metadata:
      labels:
        app: waf-logstash
    spec:
      # ES가 먼저 뜨도록 간단 대기 (ES가 늦어도 LS는 재시도하므로 없어도 동작은 함)
      initContainers:
      - name: wait-for-elasticsearch
        image: curlimages/curl:8.4.0
        command: ["sh", "-c", "until curl -fsS http://elasticsearch.waf-data.svc.cluster.local:9200/_cluster/health >/dev/null; do echo 'Waiting for Elasticsearch...'; sleep 5; done; echo 'Elasticsearch is ready'"]
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.15.2
        ports:
        - containerPort: 9600   # Logstash HTTP API
          name: http
        env:
        - name: LS_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        - name: LOGSTASH_INTERNAL_HTTP_HOST
          value: "0.0.0.0"  # HTTP API 바인드 (기본값이지만 명시)
        args:
          - "--http.host=$(LOGSTASH_INTERNAL_HTTP_HOST)"
        volumeMounts:
        - name: pipeline
          mountPath: /usr/share/logstash/pipeline
          readOnly: true
        - name: modsec-logs
          mountPath: /var/log/modsecurity
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 9600
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 9600
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: pipeline
        configMap:
          name: logstash-pipeline
          items:
          - key: pipeline.conf
            path: pipeline.conf
          - key: waf-logs-template.json
            path: waf-logs-template.json
      - name: modsec-logs
        persistentVolumeClaim:
          claimName: waf-modsec-logs-pvc   # (waf-system 네임스페이스)

---
# Logstash Service
apiVersion: v1
kind: Service
metadata:
  name: waf-logstash
  namespace: waf-system
  labels:
    app: waf-logstash
spec:
  type: ClusterIP
  ports:
  - port: 9600
    targetPort: 9600
    protocol: TCP
    name: http
  selector:
    app: waf-logstash
