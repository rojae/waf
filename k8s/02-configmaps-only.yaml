apiVersion: v1
kind: ConfigMap
metadata:
  name: ksqldb-ddl
  namespace: waf-processing
data:
  ddl.sql: |
    -- Simplified DDL for Analytics Track Processing
    -- Maps ModSecurity events to enriched analytics data for Kibana visualization

    -- 1) RAW Stream from Fluent Bit (simplified structure)
    CREATE STREAM MODSEC_RAW (
      transaction STRUCT<
        client_ip STRING,
        time_stamp STRING,
        request STRUCT<
          method STRING,
          uri STRING,
          headers MAP<STRING, STRING>
        >,
        response STRUCT<
          http_code INT
        >,
        messages ARRAY<STRUCT<
          message STRING,
          details STRUCT<
            ruleId STRING,
            match STRING,
            data STRING,
            severity STRING
          >
        >>
      >,
      classification STRUCT<
        track STRING,
        anomaly_score INT,
        rule_id STRING,
        timestamp STRING
      >,
      processed_timestamp STRING
    ) WITH (
      KAFKA_TOPIC='waf-realtime-events',
      VALUE_FORMAT='JSON'
    );

    -- 2) Analytics Stream (filter analytics track only)
    CREATE STREAM MODSEC_ANALYTICS AS
    SELECT
      transaction->client_ip AS client_ip,
      transaction->time_stamp AS time_stamp,
      transaction->request->method AS method,
      transaction->request->uri AS uri,
      transaction->response->http_code AS status,
      classification->track AS track
    FROM MODSEC_RAW
    WHERE classification->track = 'analytics'
    EMIT CHANGES;

    -- 3) Output to analytics topic for Logstash consumption
    CREATE STREAM MODSEC_FOR_KIBANA
    WITH (
      KAFKA_TOPIC='waf-logs',
      VALUE_FORMAT='JSON'
    ) AS
    SELECT
      client_ip,
      time_stamp AS ts,
      method,
      uri,
      status,
      'analytics' AS classification_track
    FROM MODSEC_ANALYTICS
    EMIT CHANGES;

    -- 4) Real-time anomaly detection and alerting

    -- High frequency attack detection (>50 requests per minute)
    CREATE TABLE HIGH_FREQUENCY_ATTACKS
    WITH (
      KAFKA_TOPIC='waf-attack-alerts',
      VALUE_FORMAT='JSON'
    ) AS
    SELECT
      client_ip,
      COUNT(*) as request_count,
      COLLECT_LIST(uri) as attacked_uris,
      WINDOWSTART as alert_timestamp,
      'HIGH_FREQUENCY_ATTACK' as alert_type,
      'CRITICAL' as severity,
      'Client exceeded 50 requests per minute' as description
    FROM MODSEC_ANALYTICS
    WINDOW TUMBLING (SIZE 1 MINUTE)
    GROUP BY client_ip
    HAVING COUNT(*) > 50
    EMIT CHANGES;

    -- Block rate spike detection (>30% blocked in 5 minutes)
    CREATE TABLE BLOCK_RATE_ALERTS
    WITH (
      KAFKA_TOPIC='waf-block-alerts',
      VALUE_FORMAT='JSON'
    ) AS
    SELECT
      WINDOWSTART as alert_timestamp,
      COUNT(*) as total_requests,
      SUM(CASE WHEN status >= 400 THEN 1 ELSE 0 END) as blocked_requests,
      CAST((SUM(CASE WHEN status >= 400 THEN 1 ELSE 0 END) * 100.0 / COUNT(*)) AS INT) as block_rate_percent,
      'BLOCK_RATE_SPIKE' as alert_type,
      'WARNING' as severity,
      'Block rate exceeded 30% threshold' as description
    FROM MODSEC_ANALYTICS
    WINDOW TUMBLING (SIZE 5 MINUTES)
    GROUP BY 'global'
    HAVING (SUM(CASE WHEN status >= 400 THEN 1 ELSE 0 END) * 100.0 / COUNT(*)) > 30
    EMIT CHANGES;

    -- Error-only stream for URI attack analysis
    CREATE STREAM MODSEC_ERRORS AS
    SELECT *
    FROM MODSEC_ANALYTICS
    WHERE status >= 400
    EMIT CHANGES;

    -- Top attacked URIs (>10 requests per URI in 5 minutes)
    CREATE TABLE TOP_ATTACKED_URIS
    WITH (
      KAFKA_TOPIC='waf-uri-alerts',
      VALUE_FORMAT='JSON'
    ) AS
    SELECT
      uri,
      COUNT(*) as attack_count,
      COUNT_DISTINCT(client_ip) as unique_attackers,
      WINDOWSTART as alert_timestamp,
      'URI_ATTACK_SPIKE' as alert_type,
      'HIGH' as severity,
      'URI under heavy attack from multiple sources' as description
    FROM MODSEC_ERRORS
    WINDOW TUMBLING (SIZE 5 MINUTES)
    GROUP BY uri
    HAVING COUNT(*) > 10
    EMIT CHANGES;

    -- Unified alerts topic (combines all alert types)
    CREATE STREAM UNIFIED_WAF_ALERTS
    WITH (
      KAFKA_TOPIC='waf-alerts',
      VALUE_FORMAT='JSON'
    ) AS
    SELECT
      alert_type,
      severity,
      client_ip,
      CAST(NULL AS STRING) as uri,
      request_count as metric_value,
      alert_timestamp,
      description
    FROM HIGH_FREQUENCY_ATTACKS
    EMIT CHANGES;

    -- Insert block rate alerts into unified stream
    INSERT INTO UNIFIED_WAF_ALERTS
    SELECT
      alert_type,
      severity,
      CAST(NULL AS STRING) as client_ip,
      CAST(NULL AS STRING) as uri,
      block_rate_percent as metric_value,
      alert_timestamp,
      description
    FROM BLOCK_RATE_ALERTS
    EMIT CHANGES;

    -- Insert URI attack alerts into unified stream
    INSERT INTO UNIFIED_WAF_ALERTS
    SELECT
      alert_type,
      severity,
      CAST(NULL AS STRING) as client_ip,
      uri,
      attack_count as metric_value,
      alert_timestamp,
      description
    FROM TOP_ATTACKED_URIS
    EMIT CHANGES;
  init-ksqldb.sh: |
    #!/bin/bash

    # ksqlDB 초기화 스크립트
    # DDL을 안전하게 실행하고 검증합니다

    set -e

    KSQLDB_URL="${KSQLDB_URL:-http://ksqldb.waf-processing.svc.cluster.local:8088}"
    DDL_FILE="/scripts/ddl.sql"
    MAX_RETRIES=30
    RETRY_INTERVAL=10

    echo "🚀 Starting ksqlDB initialization..."

    # ksqlDB 서비스가 준비될 때까지 대기
    wait_for_ksqldb() {
        local retries=0
        echo "⏳ Waiting for ksqlDB to be ready..."

        while [ $retries -lt $MAX_RETRIES ]; do
            if curl -s -f "$KSQLDB_URL/info" >/dev/null 2>&1; then
                echo "✅ ksqlDB is ready!"
                return 0
            fi

            retries=$((retries + 1))
            echo "   Attempt $retries/$MAX_RETRIES failed. Retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
        done

        echo "❌ ksqlDB failed to become ready after $MAX_RETRIES attempts"
        return 1
    }

    # DDL 실행
    execute_ddl() {
        echo "📝 Executing DDL script..."

        if [ ! -f "$DDL_FILE" ]; then
            echo "❌ DDL file not found: $DDL_FILE"
            return 1
        fi

        # DDL 파일을 실행하고 결과 확인
        if ksql "$KSQLDB_URL" --file "$DDL_FILE"; then
            echo "✅ DDL executed successfully"
            return 0
        else
            echo "❌ DDL execution failed"
            return 1
        fi
    }

    # 스트림 생성 검증
    verify_streams() {
        echo "🔍 Verifying stream creation..."

        local expected_streams=(
            "MODSEC_RAW"
            "MODSEC_ANALYTICS"
            "MODSEC_FOR_KIBANA"
        )

        # 현재 스트림 목록 가져오기
        local streams_output
        streams_output=$(ksql "$KSQLDB_URL" --execute "SHOW STREAMS;" 2>/dev/null || echo "")

        local missing_streams=()
        for stream in "${expected_streams[@]}"; do
            if ! echo "$streams_output" | grep -q "$stream"; then
                missing_streams+=("$stream")
            fi
        done

        if [ ${#missing_streams[@]} -eq 0 ]; then
            echo "✅ All required streams created successfully"
            echo "📊 Created streams:"
            for stream in "${expected_streams[@]}"; do
                echo "   - $stream"
            done
            return 0
        else
            echo "❌ Missing streams:"
            for stream in "${missing_streams[@]}"; do
                echo "   - $stream"
            done
            return 1
        fi
    }

    # 토픽 존재 확인
    verify_topics() {
        echo "🔍 Verifying Kafka topics..."

        local expected_topics=(
            "waf-logs"
            "waf-alerts"
        )

        # 약간의 지연을 두어 토픽 생성 시간 확보
        sleep 5

        for topic in "${expected_topics[@]}"; do
            echo "   Checking topic: $topic"
            # 토픽 존재 확인은 선택사항으로 처리 (실패해도 계속 진행)
        done

        echo "✅ Topic verification completed"
    }

    # 메인 실행
    main() {
        echo "======================================"
        echo "     ksqlDB Initialization Script     "
        echo "======================================"
        echo ""

        # 1. ksqlDB 준비 대기
        if ! wait_for_ksqldb; then
            exit 1
        fi

        echo ""

        # 2. DDL 실행
        if ! execute_ddl; then
            echo "❌ DDL execution failed, but continuing..."
            # DDL 실행 실패 시에도 계속 진행 (부분적 성공 가능성)
        fi

        echo ""

        # 3. 스트림 검증
        if ! verify_streams; then
            echo "⚠️  Some streams may be missing, but initialization completed"
            exit 1
        fi

        echo ""

        # 4. 토픽 검증
        verify_topics

        echo ""
        echo "🎉 ksqlDB initialization completed successfully!"
        echo "======================================"

        return 0
    }

    # 스크립트 실행
    main "$@"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: waf-system
data:
  pipeline.conf: |
    input {
      kafka {
        bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
        topics            => ["waf-realtime-events"]
        group_id          => "${LOGSTASH_KAFKA_GROUP:ls-waf-analytics}"
        auto_offset_reset => "earliest"
        codec             => "json"
        decorate_events   => true
      }
    }

    filter {
      if [transaction] {
        ruby {
          code => '
            require "digest"

            def normalize_waf_severity(value)
              severity = value.to_s.strip.upcase
              case severity
              when "0", "1", "2", "EMERGENCY", "ALERT", "CRITICAL"
                "CRITICAL"
              when "3", "ERROR", "HIGH"
                "HIGH"
              when "4", "WARNING", "WARN", "MEDIUM"
                "MEDIUM"
              when "5", "NOTICE", "LOW"
                "LOW"
              when "6", "7", "INFO", "INFORMATIONAL", "DEBUG"
                "INFO"
              else
                severity.empty? ? "INFO" : severity
              end
            end

            tx = event.get("transaction") || {}
            req = tx["request"] || {}
            res = tx["response"] || {}
            headers = req["headers"] || {}
            messages = tx["messages"].is_a?(Array) ? tx["messages"] : []
            first_details = {}
            first_message = ""
            rule_ids = []
            severities = []
            tags = []

            messages.each do |msg|
              next unless msg.is_a?(Hash)
              details = msg["details"].is_a?(Hash) ? msg["details"] : {}
              first_details = details if first_details.empty?
              first_message = msg["message"].to_s if first_message.empty? && msg["message"]
              rule_ids << details["ruleId"].to_s if details["ruleId"]
              severities << details["severity"].to_s if details["severity"]
              if details["tags"].is_a?(Array)
                tags.concat(details["tags"].map(&:to_s))
              end
            end

            rule_id = event.get("[classification][rule_id]").to_s
            rule_id = rule_ids.first.to_s if rule_id.empty?
            severity = normalize_waf_severity(severities.first)
            message = first_details["msg"].to_s
            message = first_details["message"].to_s if message.empty?
            message = first_message if message.empty?

            attack_type = "Other"
            rule_ids_for_type = ([rule_id] + rule_ids).reject(&:empty?)
            rule_ids_for_type.each do |rid|
              case rid
              when /^942/
                attack_type = "SQL Injection"
                break
              when /^941/
                attack_type = "XSS"
                break
              when /^932/
                attack_type = "RCE"
                break
              when /^930/
                attack_type = "Path Traversal"
                break
              when /^913/
                attack_type = "Scanner"
                break
              when /^920/
                attack_type = "Protocol"
                break
              end
            end

            intervention = tx["intervention"].is_a?(Hash) ? tx["intervention"] : {}
            status_code = res["http_code"].to_i
            action = intervention["action"].to_s.downcase
            blocked = intervention["disruptive"] == true || ["deny", "drop", "block"].include?(action) || intervention["status"].to_i == 403 || status_code == 403

            tx_id = tx["id"].to_s
            tx_id = tx["unique_id"].to_s if tx_id.empty?
            if tx_id.empty?
              topic = event.get("[@metadata][kafka][topic]")
              partition = event.get("[@metadata][kafka][partition]")
              offset = event.get("[@metadata][kafka][offset]")
              if topic && partition && offset
                tx_id = "kafka-#{topic}-#{partition}-#{offset}"
              else
                tx_id = "raw-#{Digest::SHA256.hexdigest(tx.to_s)[0, 24]}"
              end
            end

            event.set("tx_id", tx_id)
            event.set("client_ip", tx["client_ip"])
            event.set("method", req["method"])
            event.set("uri", req["uri"])
            event.set("status_code", status_code)
            event.set("rule_id", rule_id)
            event.set("severity", severity)
            event.set("attack_type", attack_type)
            event.set("message", message)
            event.set("blocked", blocked)
            event.set("user_agent", headers["User-Agent"])
            event.set("timestamp", tx["time_stamp"])
            event.set("classification_track", event.get("[classification][track]") || event.get("track") || "raw")
            event.set("rule_ids", rule_ids)
            event.set("tags", tags)
          '
        }

        date {
          match => ["timestamp", "EEE MMM dd HH:mm:ss yyyy", "EEE MMM  d HH:mm:ss yyyy", "dd/MMM/yyyy:HH:mm:ss Z", "ISO8601"]
          target => "@timestamp"
          timezone => "UTC"
        }

        if [client_ip] and [client_ip] !~ /^(127\.|10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.)/ {
          geoip {
            source => "client_ip"
            target => "geo"
          }
          ruby {
            code => '
              country = event.get("[geo][country_iso_code]")
              event.set("country", country) if country && !country.to_s.empty?
            '
          }
        }

        ruby {
          code => '
            ts = event.get("@timestamp")
            event.set("timestamp", ts.time.utc.strftime("%Y-%m-%dT%H:%M:%S.%3NZ")) if ts
          '
        }

        mutate {
          convert => {
            "status_code" => "integer"
            "blocked" => "boolean"
          }
          remove_field => ["@version", "event", "host", "log", "transaction", "classification", "geo"]
        }
      }
    }

    output {
      elasticsearch {
        hosts              => ["${ELASTICSEARCH_HOSTS:http://waf-es:9200}"]
        index              => "waf-logs-%{+YYYY.MM.dd}"
        document_id        => "%{tx_id}"
        ilm_enabled        => false
        template           => "/usr/share/logstash/pipeline/waf-logs-template.json"
        template_api       => "composable"
        template_name      => "waf-logs-template"
        template_overwrite => true
      }
    }
  waf-logs-template.json: |
    {
      "index_patterns": ["waf-logs-*"],
      "template": {
        "mappings": {
          "properties": {
            "timestamp": { "type": "date" },
            "client_ip": { "type": "ip" },
            "method": { "type": "keyword" },
            "uri": {
              "type": "text",
              "fields": {
                "keyword": { "type": "keyword", "ignore_above": 2048 }
              }
            },
            "status_code": { "type": "integer" },
            "rule_id": { "type": "keyword" },
            "severity": { "type": "keyword" },
            "attack_type": { "type": "keyword" },
            "message": { "type": "text" },
            "blocked": { "type": "boolean" },
            "country": { "type": "keyword" },
            "user_agent": { "type": "text" },
            "response_time": { "type": "long" },
            "tx_id": { "type": "keyword" },
            "classification_track": { "type": "keyword" }
          }
        }
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-initdb
  namespace: waf-data
data:
  init.sql: |
    -- WAF Analytics Database Schema
    CREATE DATABASE IF NOT EXISTS waf_analytics;

    -- Events 테이블 (분석용 로그)
    CREATE TABLE IF NOT EXISTS waf_analytics.events (
        timestamp DateTime64(3) DEFAULT now(),
        date Date DEFAULT toDate(timestamp),
        tx_id String,
        client_ip IPv4,
        uri String,
        method String,
        status_code UInt16,
        rule_id String,
        anomaly_score UInt16,
        severity String,
        category String,
        msg String,
        classification_track String,
        user_agent String,
        country_code String,
        city String,
        is_scanner_detected Bool DEFAULT false,
        tags Array(String) DEFAULT []
    ) ENGINE = MergeTree()
    PARTITION BY date
    ORDER BY (timestamp, client_ip, rule_id)
    TTL timestamp + INTERVAL 1 YEAR
    SETTINGS index_granularity = 8192;

    -- Additive compatibility columns for the Kafka -> ClickHouse consumer.
    -- These ALTERs are intentionally non-destructive so existing deployments can
    -- retain data while accepting the enriched insert shape.
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS country_name String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS latitude Float64 DEFAULT 0;
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS longitude Float64 DEFAULT 0;
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS referer String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS accept_language String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS attack_type String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS attack_category String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS severity_level String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS browser String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS browser_version String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS os String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS os_version String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS device String DEFAULT '';
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS is_bot Bool DEFAULT false;
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS is_mobile Bool DEFAULT false;
    ALTER TABLE waf_analytics.events ADD COLUMN IF NOT EXISTS is_tablet Bool DEFAULT false;

    -- IP별 공격 패턴 집계 테이블
    CREATE TABLE IF NOT EXISTS waf_analytics.ip_attack_summary (
        date Date,
        hour UInt8,
        client_ip IPv4,
        country_code String,
        attack_count UInt32,
        avg_anomaly_score Float32,
        max_anomaly_score UInt16,
        unique_rules UInt16,
        unique_uris UInt16,
        first_seen DateTime,
        last_seen DateTime
    ) ENGINE = SummingMergeTree()
    PARTITION BY date
    ORDER BY (date, hour, client_ip)
    TTL date + INTERVAL 90 DAY;

    -- 룰별 공격 통계
    CREATE TABLE IF NOT EXISTS waf_analytics.rule_statistics (
        date Date,
        rule_id String,
        category String,
        severity String,
        trigger_count UInt32,
        unique_ips UInt32,
        avg_anomaly_score Float32,
        blocked_count UInt32,
        allowed_count UInt32
    ) ENGINE = SummingMergeTree()
    PARTITION BY date
    ORDER BY (date, rule_id)
    TTL date + INTERVAL 180 DAY;

    -- URI별 공격 패턴
    CREATE TABLE IF NOT EXISTS waf_analytics.uri_attack_patterns (
        date Date,
        uri String,
        method String,
        attack_count UInt32,
        unique_ips UInt32,
        top_rule_id String,
        avg_response_time_ms Float32,
        blocked_ratio Float32
    ) ENGINE = SummingMergeTree()
    PARTITION BY date
    ORDER BY (date, uri, method)
    TTL date + INTERVAL 90 DAY;

    -- 실시간 집계용 Materialized Views
    CREATE MATERIALIZED VIEW IF NOT EXISTS waf_analytics.mv_ip_hourly_stats
    TO waf_analytics.ip_attack_summary AS
    SELECT
        toDate(timestamp) AS date,
        toHour(timestamp) AS hour,
        client_ip,
        any(country_code) AS country_code,
        count() AS attack_count,
        avg(anomaly_score) AS avg_anomaly_score,
        max(anomaly_score) AS max_anomaly_score,
        uniqExact(rule_id) AS unique_rules,
        uniqExact(uri) AS unique_uris,
        min(timestamp) AS first_seen,
        max(timestamp) AS last_seen
    FROM waf_analytics.events
    WHERE anomaly_score > 0
    GROUP BY date, hour, client_ip;

    CREATE MATERIALIZED VIEW IF NOT EXISTS waf_analytics.mv_rule_daily_stats
    TO waf_analytics.rule_statistics AS
    SELECT
        toDate(timestamp) AS date,
        rule_id,
        any(category) AS category,
        any(severity) AS severity,
        count() AS trigger_count,
        uniqExact(client_ip) AS unique_ips,
        avg(anomaly_score) AS avg_anomaly_score,
        sumIf(1, status_code >= 400) AS blocked_count,
        sumIf(1, status_code < 400) AS allowed_count
    FROM waf_analytics.events
    WHERE rule_id != ''
    GROUP BY date, rule_id;

    -- 스캐너 감지 전용 테이블
    CREATE TABLE IF NOT EXISTS waf_analytics.scanner_events (
        timestamp DateTime64(3) DEFAULT now(),
        date Date DEFAULT toDate(timestamp),
        client_ip IPv4,
        user_agent String,
        scan_type String,
        total_requests UInt32,
        unique_uris UInt16,
        scan_duration_seconds UInt32,
        detected_vulnerabilities Array(String),
        risk_score UInt8
    ) ENGINE = MergeTree()
    PARTITION BY date
    ORDER BY (timestamp, client_ip)
    TTL timestamp + INTERVAL 30 DAY;

    -- 분석용 뷰들
    CREATE VIEW IF NOT EXISTS waf_analytics.v_top_attackers AS
    SELECT
        client_ip,
        country_code,
        sum(attack_count) AS total_attacks,
        avg(avg_anomaly_score) AS avg_score,
        max(max_anomaly_score) AS max_score,
        min(first_seen) AS first_attack,
        max(last_seen) AS last_attack,
        uniqExact(date) AS active_days
    FROM waf_analytics.ip_attack_summary
    WHERE date >= today() - 30
    GROUP BY client_ip, country_code
    ORDER BY total_attacks DESC
    LIMIT 100;

    CREATE VIEW IF NOT EXISTS waf_analytics.v_attack_trends AS
    SELECT
        date,
        sum(trigger_count) AS daily_attacks,
        uniqExact(rule_id) AS unique_rules_triggered,
        avg(avg_anomaly_score) AS avg_severity,
        sum(blocked_count) AS blocked_requests,
        sum(allowed_count) AS allowed_requests,
        blocked_requests / (blocked_requests + allowed_requests) * 100 AS block_rate
    FROM waf_analytics.rule_statistics
    WHERE date >= today() - 90
    GROUP BY date
    ORDER BY date DESC;
