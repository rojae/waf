---
# Nginx WAF Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-waf
  namespace: waf-system
  labels:
    app: nginx-waf
    component: waf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-waf
  template:
    metadata:
      labels:
        app: nginx-waf
    spec:
      containers:
      - name: nginx-waf
        image: waf-nginx:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        volumeMounts:
        - name: modsec-logs
          mountPath: /var/log/modsecurity
        - name: custom-whitelist
          mountPath: /etc/modsecurity/custom-whitelist.conf
          subPath: custom-whitelist.conf
          readOnly: true
        - name: custom-rules
          mountPath: /etc/modsecurity/custom-rules
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: modsec-logs
        persistentVolumeClaim:
          claimName: waf-modsec-logs-pvc
      - name: custom-whitelist
        configMap:
          name: nginx-custom-whitelist
      - name: custom-rules
        persistentVolumeClaim:
          claimName: waf-custom-rules-pvc

---
# ConfigMap for custom whitelist
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-custom-whitelist
  namespace: waf-system
data:
  custom-whitelist.conf: |
    # Custom ModSecurity Whitelist Rules

    # Reduce false positives for local static assets without disabling the rule engine.
    SecRule REQUEST_FILENAME "@rx \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$" \
        "id:1001,\
        phase:1,\
        pass,\
        t:lowercase,\
        msg:'Whitelisting static assets',\
        tag:'WHITELIST_STATIC',\
        ctl:ruleRemoveById=920420"

    # Whitelist common browser requests
    SecRule REQUEST_URI "@rx ^/(favicon\.ico|robots\.txt|sitemap\.xml|manifest\.json|apple-touch-icon.*\.png)$" \
        "id:1002,\
        phase:1,\
        pass,\
        t:lowercase,\
        msg:'Whitelisting common browser requests',\
        tag:'WHITELIST_BROWSER',\
        ctl:ruleRemoveById=920420"

    # Exact local health endpoints only.
    SecRule REQUEST_URI "@rx ^/(health|ready|live)$" \
        "id:1003,\
        phase:1,\
        pass,\
        t:lowercase,\
        msg:'Whitelisting health check endpoints',\
        tag:'WHITELIST_HEALTH',\
        ctl:ruleRemoveById=920420"

---
# ClusterIP Service for internal access
apiVersion: v1
kind: Service
metadata:
  name: nginx-waf-service
  namespace: waf-system
  labels:
    app: nginx-waf
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: nginx-waf

---
# NodePort Service for external access on port 8080
apiVersion: v1
kind: Service
metadata:
  name: nginx-waf-nodeport
  namespace: waf-system
  labels:
    app: nginx-waf
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
  selector:
    app: nginx-waf

---
# Fluent Bit for log collection (single replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
  namespace: waf-system
  labels:
    app: fluent-bit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:2.2
        ports:
        - containerPort: 2020
        volumeMounts:
        - name: modsec-logs
          mountPath: /var/log/modsecurity
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/fluent-bit.conf
          subPath: fluent-bit.conf
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/parsers.conf
          subPath: parsers.conf
        - name: waf-classifier
          mountPath: /fluent-bit/etc/waf_classifier.lua
          subPath: waf_classifier.lua
          readOnly: true
        - name: fluent-bit-state
          mountPath: /var/lib/fluent-bit
        command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
      volumes:
      - name: modsec-logs
        persistentVolumeClaim:
          claimName: waf-modsec-logs-pvc
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      - name: waf-classifier
        configMap:
          name: waf-classifier-config
      - name: fluent-bit-state
        persistentVolumeClaim:
          claimName: waf-fluent-bit-state-pvc

# Service for Fluent Bit
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: waf-system
  labels:
    app: fluent-bit
spec:
  type: ClusterIP
  ports:
  - port: 2020
    targetPort: 2020
    protocol: TCP
  selector:
    app: fluent-bit
