version: "3.8"

services:
  # WAF Dashboard API
  waf-dashboard-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dashboard-api
    container_name: waf-dashboard-api
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - GRAFANA_URL=http://grafana:3000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - WAF_MANAGEMENT_STORE=/app/data/management.json
    volumes:
      - custom-rules-volume:/app/custom-rules
      - ./nginx/modsecurity/rules:/app/modsecurity-rules:ro
      - waf-management-data:/app/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # WAF Social API
  waf-social-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: social-api
    container_name: waf-social-api
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3001/login/oauth2/code/google}
      - OAUTH_CALLBACK_BASE_URL=${OAUTH_CALLBACK_BASE_URL:-http://localhost:3001}
      - OAUTH_DEFAULT_REDIRECT_URL=${OAUTH_DEFAULT_REDIRECT_URL:-http://localhost:3001}
    restart: unless-stopped

  # Next.js Frontend Dashboard
  waf-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: waf-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SOCIAL_API_URL=http://waf-social-api:8081
      - DASHBOARD_API_URL=http://waf-dashboard-api:8082
      - NEXT_PUBLIC_SOCIAL_API_URL=http://localhost:8081
      - NEXT_PUBLIC_DASHBOARD_API_URL=http://localhost:8082
    depends_on:
      - waf-dashboard-api
      - waf-social-api
    restart: unless-stopped

volumes:
  custom-rules-volume:
  waf-management-data:
