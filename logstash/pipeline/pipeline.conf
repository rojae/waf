input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
    topics            => ["waf-realtime-events"]
    group_id          => "${LOGSTASH_KAFKA_GROUP:ls-waf-analytics}"
    auto_offset_reset => "earliest"
    codec             => "json"
    decorate_events   => true
  }
}

filter {
  if [transaction] {
    ruby {
      code => '
        require "digest"

        def normalize_waf_severity(value)
          severity = value.to_s.strip.upcase
          case severity
          when "0", "1", "2", "EMERGENCY", "ALERT", "CRITICAL"
            "CRITICAL"
          when "3", "ERROR", "HIGH"
            "HIGH"
          when "4", "WARNING", "WARN", "MEDIUM"
            "MEDIUM"
          when "5", "NOTICE", "LOW"
            "LOW"
          when "6", "7", "INFO", "INFORMATIONAL", "DEBUG"
            "INFO"
          else
            severity.empty? ? "INFO" : severity
          end
        end

        tx = event.get("transaction") || {}
        req = tx["request"] || {}
        res = tx["response"] || {}
        headers = req["headers"] || {}
        messages = tx["messages"].is_a?(Array) ? tx["messages"] : []
        first_details = {}
        first_message = ""
        rule_ids = []
        severities = []
        tags = []

        messages.each do |msg|
          next unless msg.is_a?(Hash)
          details = msg["details"].is_a?(Hash) ? msg["details"] : {}
          first_details = details if first_details.empty?
          first_message = msg["message"].to_s if first_message.empty? && msg["message"]
          rule_ids << details["ruleId"].to_s if details["ruleId"]
          severities << details["severity"].to_s if details["severity"]
          if details["tags"].is_a?(Array)
            tags.concat(details["tags"].map(&:to_s))
          end
        end

        rule_id = event.get("[classification][rule_id]").to_s
        rule_id = rule_ids.first.to_s if rule_id.empty?
        severity = normalize_waf_severity(severities.first)
        message = first_details["msg"].to_s
        message = first_details["message"].to_s if message.empty?
        message = first_message if message.empty?

        attack_type = "Other"
        rule_ids_for_type = ([rule_id] + rule_ids).reject(&:empty?)
        rule_ids_for_type.each do |rid|
          case rid
          when /^942/
            attack_type = "SQL Injection"
            break
          when /^941/
            attack_type = "XSS"
            break
          when /^932/
            attack_type = "RCE"
            break
          when /^930/
            attack_type = "Path Traversal"
            break
          when /^913/
            attack_type = "Scanner"
            break
          when /^920/
            attack_type = "Protocol"
            break
          end
        end

        intervention = tx["intervention"].is_a?(Hash) ? tx["intervention"] : {}
        status_code = res["http_code"].to_i
        action = intervention["action"].to_s.downcase
        blocked = intervention["disruptive"] == true || ["deny", "drop", "block"].include?(action) || intervention["status"].to_i == 403 || status_code == 403

        tx_id = tx["id"].to_s
        tx_id = tx["unique_id"].to_s if tx_id.empty?
        if tx_id.empty?
          topic = event.get("[@metadata][kafka][topic]")
          partition = event.get("[@metadata][kafka][partition]")
          offset = event.get("[@metadata][kafka][offset]")
          if topic && partition && offset
            tx_id = "kafka-#{topic}-#{partition}-#{offset}"
          else
            tx_id = "raw-#{Digest::SHA256.hexdigest(tx.to_s)[0, 24]}"
          end
        end

        event.set("tx_id", tx_id)
        event.set("client_ip", tx["client_ip"])
        event.set("method", req["method"])
        event.set("uri", req["uri"])
        event.set("status_code", status_code)
        event.set("rule_id", rule_id)
        event.set("severity", severity)
        event.set("attack_type", attack_type)
        event.set("message", message)
        event.set("blocked", blocked)
        event.set("user_agent", headers["User-Agent"])
        event.set("timestamp", tx["time_stamp"])
        event.set("classification_track", event.get("[classification][track]") || event.get("track") || "raw")
        event.set("rule_ids", rule_ids)
        event.set("tags", tags)
      '
    }

    date {
      match => ["timestamp", "EEE MMM dd HH:mm:ss yyyy", "EEE MMM  d HH:mm:ss yyyy", "dd/MMM/yyyy:HH:mm:ss Z", "ISO8601"]
      target => "@timestamp"
      timezone => "UTC"
    }

    if [client_ip] and [client_ip] !~ /^(127\.|10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.)/ {
      geoip {
        source => "client_ip"
        target => "geo"
      }
      ruby {
        code => '
          country = event.get("[geo][country_iso_code]")
          event.set("country", country) if country && !country.to_s.empty?
        '
      }
    }

    ruby {
      code => '
        ts = event.get("@timestamp")
        event.set("timestamp", ts.time.utc.strftime("%Y-%m-%dT%H:%M:%S.%3NZ")) if ts
      '
    }

    mutate {
      convert => {
        "status_code" => "integer"
        "blocked" => "boolean"
      }
      remove_field => ["@version", "event", "host", "log", "transaction", "classification", "geo"]
    }
  }
}

output {
  elasticsearch {
    hosts              => ["${ELASTICSEARCH_HOSTS:http://waf-es:9200}"]
    index              => "waf-logs-%{+YYYY.MM.dd}"
    document_id        => "%{tx_id}"
    ilm_enabled        => false
    template           => "/usr/share/logstash/pipeline/waf-logs-template.json"
    template_api       => "composable"
    template_name      => "waf-logs-template"
    template_overwrite => true
  }
}
